agent_impact: >-
  An agent calling this API has no runtime backpressure signal at all. It cannot discover a
  budget before exhausting it, cannot learn a reset window, and has no documented status code
  to branch on. The only cost control is commercial rather than technical — orders spend
  prepaid image credits (see plans/pixc-plans-pricing.yml), and the `test: true` header lets
  a caller validate a payload without spending them (see sandbox/pixc-sandbox.yml).


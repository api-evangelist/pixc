apis:
- name: Pixc Public API
  description: >-
    REST API for automated product-photo optimization. Three resources — templates (the
    reusable photo standard: background, border, shadow, output file types and aspect
    sizes), orders (a batch of submitted image URLs processed against one template), and
    webhooks (order_created, order_status_updated, download_generated) — across sixteen
    operations. Results are read back as per-image records with one rendered output per
    template type/size combination, or as packaged downloads. Authentication is a bearer
    Access Token issued from the Pixc Dashboard; the published spec additionally declares an
    OAuth 2.0 implicit flow with eleven granular scopes. Every operation accepts a
    `test: true` header that validates the request without modifying the account or spending
    image credits. Published by Pixc as Swagger 2.0 at https://dashboard.pixc.com/v1/schema.
  humanURL: https://pixc.com/api/
  baseURL: https://dashboard.pixc.com/v1

- name: Order
  schema: OrderObject
  id_field: orderId
  id_type: integer
  fields: [orderId, status, payment, templateId, createdAt]
  notes: >-
    `status` is an untyped integer whose value vocabulary is not documented anywhere.
    `payment` is a string (the Node SDK README shows the value "paid").
  operations: [apiListOrder, apiAddOrder, apiShowOrder, apiCancelOrder]
- name: Template
  schema: TemplateObject
  id_field: templateId
  id_type: integer
  fields: [templateId, name, group, background, border, borderWidth, types, sizes]
  notes: >-
    `group` accepts the single enum value "autobg", which attaches a fully-automated
    background handler to every order using the template.
  operations: [apiListTemplate, apiAddTemplate, apiShowTemplate, apiUpdateTemplate, apiRemoveTemplate]
- name: TemplateType
  schema: TemplateTypeObject

aid: pixc
name: Pixc
description: Pixc is an ecommerce enablement company that builds Shopify apps automating
  the visual busywork of running an online store — product photo resizing and AI framing,
  background removal and retouching, AI-generated alt text for SEO, AI lifestyle imagery,
  and automated visual merchandising of collections. Founded in 2014 and backed by
  500 Global, Pixc also runs a professional bulk product photo-editing service billed in
  prepaid image credits, and serves 32,000+ Shopify merchants. Pixc publishes a public
  REST API — the Pixc Public API at https://dashboard.pixc.com/v1 — that lets a store or
  marketplace automate the same photo optimization programmatically — define a reusable
  template encoding the photo standard, submit batches of image URLs as orders, register
  webhooks for completion, and collect the optimized results as image URLs or packaged
  downloads.

summary: >-
  Three top-level resources — Template, Order, Webhook — plus two read-only children of an
  order (Image and Download). A Template encodes the merchant's photo standard (background,
  border, shadow, output types, aspect sizes); an Order applies one Template to a batch of
  submitted files; Images and Downloads are the outputs Pixc produces for that Order.
  Entity ids are bare integers with no prefixes.


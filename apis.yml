x-pointers-deliberately-omitted:
- type: WellKnown
  reason: >-
    well-known/pixc-well-known.yml records a probe in which every /.well-known/ path returned
    404 on dashboard.pixc.com and 403 on pixc.com. The artifact documents an absence; a
    pointer would assert Pixc serves the surface.
- type: MCPServer
  reason: >-
    mcp/pixc-mcp.yml is a derived candidate tool list with deployment.mode = none. Pixc ships
    no hosted or local MCP server, so a pointer would credit an agent surface that does not exist.
- type: AgentCard
  reason: >-
    /.well-known/agent-card.json and /.well-known/agent.json miss on every host. Per the
    pipeline, nothing was written to a2a/.
- type: Idempotency
  reason: >-
    No idempotency header, parameter or retry-safety contract exists in the published spec or
    docs. See conventions/pixc-conventions.yml.
- type: StatusPage
  reason: >-
    status.pixc.com returns HTTP 200 but the body is the two-byte string "OK" from the
    pixc.com DNS wildcard, not a status page. pixc.com/status is 404.
- type: Deprecation
  reason: No deprecation policy, Sunset header support or notice period is published.
- type: Security
  reason: >-
    probe-security-programs.py found no security.txt, no disclosure page and no bug bounty;
    pixc.com/security returns 404.
- type: Compliance
  reason: >-
    No trust centre and no named certification (SOC 2, ISO 27001, PCI, HIPAA, GDPR) is
    published on a reachable page; /trust and /compliance both 404.
- type: ChangeLog
  reason: >-
    No changelog, release-notes page or GitHub release exists. pixc.com/changelog is 404 and
    the sitemap lists no such page.
- type: AsyncAPI
  reason: >-
    Pixc documents webhooks but publishes no AsyncAPI document; Webhooks is pointed at
    instead and no AsyncAPI was authored on Pixc's behalf.

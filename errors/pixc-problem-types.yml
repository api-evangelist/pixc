rfc9457: false
note: >-
  Pixc does not use RFC 9457 problem+json. Every operation declares exactly one failure
  response — 400, schema ErrorResponse — carrying a JSON envelope
  { success: false, code?: string, message: string }. There is no published error-code
  reference, so the `code` field's vocabulary is undocumented; no code values could be
  harvested and none are invented here. All sixteen operations share the same single
  error shape, which is why this catalog has two entries rather than sixteen.

envelope:
  content_type: application/json
  schema: ErrorResponse
  fields:
  - {name: success, type: boolean, required: true, note: always false on an error}
  - {name: message, type: string, required: true, note: human-readable text}
  - {name: code, type: string, required: false, note: machine-readable code; vocabulary undocumented}


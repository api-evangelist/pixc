  Pixc publishes a versioned base path and nothing else. There is no versioning policy, no
  deprecation policy, no Sunset/Deprecation header support, no SLA, no changelog and no
  status page. No StatusPage or Deprecation pointer is emitted in apis.yml, because none of
  those surfaces exists.


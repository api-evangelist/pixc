  cannot be distinguished from a block there; either way nothing is served.
  SEPARATELY: pixc.com runs a DNS wildcard. Every subdomain, including invented ones
  (zzznotreal.pixc.com), resolves to 136.243.177.137 and answers HTTP 200 with the two-byte
  body "OK" at the root and 302 -> https://pixc.com/404 on every other path. api.pixc.com,
  developer.pixc.com, docs.pixc.com and status.pixc.com are ALL this wildcard, not real
  services. They are recorded here so a future run does not read those 200s as evidence.

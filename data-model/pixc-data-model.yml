- name: OrderFile
  schema: OrderFileObject
  fields: [url, name]
  notes: >-
    The input shape on POST /api/order. The body description names a third property,
    `mid` ("EXTERNAL ID"), which is NOT declared on OrderFileObject — a documented field
    missing from the schema.
- name: File
  schema: FileObject
  fields: [url]
  notes: >-
    Referenced only by SuccessFileViewResponse, which no operation returns — an orphan
    response envelope.


aid: pixc
name: Pixc
description: Pixc is an ecommerce enablement company that builds Shopify apps automating
  the visual busywork of running an online store — product photo resizing and AI framing,
  background removal and retouching, AI-generated alt text for SEO, AI lifestyle imagery,
  and automated visual merchandising of collections. Founded in 2014 and backed by
  500 Global, Pixc also runs a professional bulk product photo-editing service (pay-per-image
  credits with an optional Pixc Member subscription) and serves 32,000+ Shopify merchants.
  Pixc is an app developer and photo-editing service; it exposes no public developer API.

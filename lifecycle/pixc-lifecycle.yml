status_page_note: >-
  PROBED AND REJECTED. https://status.pixc.com/ returns HTTP 200 — but the body is the
  two-byte string "OK", which is the pixc.com DNS wildcard answering, not a status page.
  An invented control host (zzznotreal.pixc.com) returns the identical response, and every
  path other than / on those hosts 302s to https://pixc.com/404. https://pixc.com/status
  returns 404. There is no status page; the 200 is a false positive and is recorded here so
  a later run does not credit it.


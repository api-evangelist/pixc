summary: >-
  HONEST ZERO. Pixc publishes no rate limits and emits no rate-limit response headers.
  The developer page at https://pixc.com/api/ (Introduction, Getting Started, API Reference)
  contains no limit, quota, throttle or 429 language, and the published Swagger document
  declares only 200 and 400 responses on every operation — there is no 429 anywhere in the
  contract. Live probes of https://dashboard.pixc.com/v1/api/order on 2026-08-13 returned no
  X-RateLimit-*, no RateLimit-*, and no Retry-After header on either the unauthenticated or
  the bad-token request.


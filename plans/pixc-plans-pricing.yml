summary: >-
  Pixc sells the photo-editing service as prepaid image credits, not subscriptions. Four
  one-time credit packs, all at a flat $2.00 per Basic image, with credits valid for 365
  days. The pricing page states "Pay only for images you need" and "All prices are in USD",
  and shows no subscription tier and no overage schedule.
  IMPORTANT: none of these plans is an API plan. The Pixc Public API
  (https://dashboard.pixc.com/v1) is not separately priced, metered or tiered anywhere on
  the developer surface — an API caller spends the same image credits an order placed
  through the dashboard would spend. There is no free tier, no API-specific quota and no
  published enterprise/volume tier.


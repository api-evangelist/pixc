  note: >-
    UNDOCUMENTED. Observed live on GET https://dashboard.pixc.com/v1/api/order with no
    Authorization header AND with a deliberately invalid bearer token — both return a
    byte-identical 403 with no `code` field. The spec declares only 200 and 400, so an
    agent following the contract has no branch for the single most likely failure it will
    hit. There is no way to distinguish missing credential, invalid credential and
    insufficient scope from the response.
  remediation: >-
    Check that an Access Token from Account Settings > API Access is present as
    `Authorization: Bearer ACCESS_TOKEN`, and that the token's scopes cover the operation
    (see scopes/pixc-scopes.yml).


    schema — an orphan definition.
- name: Webhook
  schema: WebhookObject
  id_field: webhookId
  id_type: integer
  fields: [webhookId, url, type, active, createdAt]
  enum_type: [order_created, order_status_updated, download_generated]
  operations: [apiListWebhook, apiAddWebhook, apiShowWebhook, apiUpdateWebhook, apiRemoveWebhook]
- name: Image
  schema: ImageObject
  id_field: imageId
  id_type: integer
  fields: [imageId, orderId, status, name, url, urlEdited, urlOriginal, mid, results]
  notes: >-
    `mid` is the caller-supplied external id echoed back from the order submission — the
    only correlation key between a merchant's own catalog and Pixc's output.
  operations: [apiImageListOrder]
- name: ImageResult
  schema: ImageResultObject
  fields: [url, size, background, type, border]
  embedded_in: Image
  notes: One rendered output per template type/size combination.
- name: Download
  schema: DownloadObject
  id_field: downloadId
  id_type: integer
  fields: [downloadId, orderId, url, createdAt]

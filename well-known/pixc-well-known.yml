note: >-
  RECORDED ABSENCE — Pixc serves no /.well-known/ discovery documents on any host, so no
  WellKnown or SecurityTxt pointer is emitted in apis.yml. Two distinct failure shapes were
  observed. On the API host (dashboard.pixc.com) every path returns a clean 404. On the
  marketing host (pixc.com) every /.well-known/* path returns 403 with a 146-byte HTML body
